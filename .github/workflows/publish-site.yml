name: Publish GO'EL site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tracking.html"
      - "privacy.html"
      - "delivery.html"
      - "img/**"
      - "scripts/generate_brand_pages.py"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish files to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- index.html tracking.html privacy.html delivery.html img .nojekyll
          mkdir -p scripts
          git show main:scripts/generate_brand_pages.py > scripts/generate_brand_pages.py
          python3 scripts/generate_brand_pages.py
          git add index.html tracking.html privacy.html delivery.html img .nojekyll
          git add -f godderob sote art amenshop
          if git diff --cached --quiet; then
            echo "No gh-pages changes"
            exit 0
          fi
          git commit -m "Sync site from main"
          git push origin gh-pages
