name: Publish GO'EL site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tracking.html"
      - "privacy.html"
      - "delivery.html"
      - "img/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp tracking.html _site/tracking.html
          cp privacy.html _site/privacy.html
          cp delivery.html _site/delivery.html
          cp -R img _site/img

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

  sync-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish files to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- index.html tracking.html privacy.html delivery.html img .nojekyll
          git add index.html tracking.html privacy.html delivery.html img .nojekyll
          if git diff --cached --quiet; then
            echo "No gh-pages changes"
            exit 0
          fi
          git commit -m "Sync site from main"
          git push origin gh-pages

